name: Build artifact

# Builds the app and publishes the APKs as a workflow artifact, so a branch can be
# installed on a device without cutting a release. Signing uses the same keystore
# secrets as the release workflow; without them the build falls back to debug
# signing (APKs are installable, but not as an update over a release install).

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main
      - l10n_dev_crowdin
    paths-ignore:
      - '**/README.md'

concurrency:
  group: artifact-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build APKs
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
            export KEYSTORE_PATH="$RUNNER_TEMP/keystore.jks"
          else
            echo "No keystore secret found; building with debug signing."
          fi
          ./gradlew assembleGoogleRelease --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: kiroku-apks-${{ github.event.repository.name }}-${{ github.run_number }}
          path: app/build/outputs/apk/google/release/*.apk
          if-no-files-found: error
          retention-days: 7
